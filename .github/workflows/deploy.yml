# .github/workflows/deploy.yml
# Deploys to Cloudflare Pages (static site + Functions API).
# Environment variables (IPINFO_TOKEN, ABUSEIPDB_TOKEN, AD_TOP_HTML, AD_160_HTML)
# are pushed to Cloudflare Pages production environment via the `secrets` parameter.
# Pages Functions read them via context.env.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Configuration
        env:
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
        run: |
          node << 'ENDSCRIPT'
          const fs = require('fs');
          const env = {
            AD_TOP_HTML:     process.env.AD_TOP_HTML     || '',
            AD_160_HTML:     process.env.AD_160_HTML     || '',
            IPINFO_TOKEN:    process.env.IPINFO_TOKEN    || '',
            ABUSEIPDB_TOKEN: process.env.ABUSEIPDB_TOKEN || '',
          };
          fs.writeFileSync('env-config.js',
            'window.__ENV__ = ' + JSON.stringify(env, null, 2) + ';\n');
          console.log('env-config.js written with keys:', Object.keys(env).filter(k => env[k]).join(', '));
          ENDSCRIPT

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ip-linkozen
          directory:   .
          branch:      main
          secrets: |
            IPINFO_TOKEN=${{ secrets.IPINFO_TOKEN }}
            ABUSEIPDB_TOKEN=${{ secrets.ABUSEIPDB_TOKEN }}
            AD_TOP_HTML=${{ secrets.AD_TOP_HTML }}
            AD_160_HTML=${{ secrets.AD_160_HTML }}
