name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=ip-linkozen --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set environment variables in Cloudflare
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node << 'ENDSCRIPT'
          const { execSync } = require('child_process');
          const vars = [
            ['IPINFO_TOKEN',    process.env.IPINFO_TOKEN    || ''],
            ['ABUSEIPDB_TOKEN', process.env.ABUSEIPDB_TOKEN || ''],
            ['AD_TOP_HTML',     process.env.AD_TOP_HTML     || ''],
            ['AD_160_HTML',     process.env.AD_160_HTML     || ''],
          ];
          for (const [name, val] of vars) {
            if (!val) { console.log('Skip ' + name + ' (empty)'); continue; }
            const cmd = 'npx wrangler pages secret set ' + name +
                        ' --project-name=ip-linkozen --branch=main';
            execSync(cmd, { input: val, stdio: ['pipe', 'inherit', 'inherit'] });
            console.log('Set ' + name + ' (len=' + val.length + ')');
          }
          ENDSCRIPT
