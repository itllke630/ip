# .github/workflows/deploy.yml
# ───────────────────────────────────────────────────────────────────
# Deploys to Cloudflare Pages (static site + Functions API).
# One project, three domains — DNS record type determines IP family:
#   v4.ip.linkozen.com → A     only → client connects via IPv4
#   v6.ip.linkozen.com → AAAA  only → client connects via IPv6
#   ip.linkozen.com     → both       → UI + API
#
# REQUIRED SECRETS (GitHub repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN    – token with Pages edit permission
#   CLOUDFLARE_ACCOUNT_ID   – Cloudflare account ID (32-char hex)
#
# OPTIONAL SECRETS:
#   AD_TOP_HTML             – 728×90 leaderboard ad code
#   AD_160_HTML             – 160×600 skyscraper ad code (both sides)
#   IPINFO_TOKEN            – IPinfo.io API token
#   ABUSEIPDB_TOKEN         – AbuseIPDB API token

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into code
        env:
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
        run: |
          node << 'ENDSCRIPT'
          const fs = require('fs');

          // config.js — ad slots
          fs.writeFileSync('config.js',
            'window.__AD_TOP = ' + JSON.stringify(process.env.AD_TOP_HTML || '') + ';\n' +
            'window.__AD_SKY = ' + JSON.stringify(process.env.AD_160_HTML || '') + ';\n');

          // Proxy functions — inject API tokens
          const ipinfoToken = process.env.IPINFO_TOKEN || '';
          const abuseToken  = process.env.ABUSEIPDB_TOKEN || '';

          let ipinfo = fs.readFileSync('functions/api/ipinfo.js', 'utf8');
          ipinfo = ipinfo.replace('__IPINFO_TOKEN__', ipinfoToken);
          fs.writeFileSync('functions/api/ipinfo.js', ipinfo);

          let abuse = fs.readFileSync('functions/api/abuseipdb.js', 'utf8');
          abuse = abuse.replace('__ABUSEIPDB_TOKEN__', abuseToken);
          fs.writeFileSync('functions/api/abuseipdb.js', abuse);
          ENDSCRIPT

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ip-linkozen
          directory:   .
          branch:      main
