name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=ip-linkozen --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set environment variables in Cloudflare
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node << 'ENDSCRIPT'
          const https = require('https');

          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const projectName = 'ip-linkozen';
          const baseUrl = 'https://api.cloudflare.com/client/v4/accounts/' + accountId +
                          '/pages/projects/' + projectName + '/envvars';

          const vars = [
            { name: 'IPINFO_TOKEN',    value: process.env.IPINFO_TOKEN    || '' },
            { name: 'ABUSEIPDB_TOKEN', value: process.env.ABUSEIPDB_TOKEN || '' },
            { name: 'AD_TOP_HTML',     value: process.env.AD_TOP_HTML     || '' },
            { name: 'AD_160_HTML',     value: process.env.AD_160_HTML     || '' },
          ].filter(v => v.value);

          if (vars.length === 0) { console.log('No env vars to set.'); process.exit(0); }

          // Cloudflare API: PATCH to upsert env vars
          const body = JSON.stringify(vars.map(v => ({ name: v.name, value: v.value })));
          const req = https.request(baseUrl, {
            method: 'PATCH',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
            },
          }, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              const r = JSON.parse(data);
              if (r.success) {
                console.log('Env vars set:', vars.map(v => v.name).join(', '));
              } else {
                console.error('API error:', JSON.stringify(r.errors));
                process.exit(1);
              }
            });
          });
          req.on('error', e => { console.error(e); process.exit(1); });
          req.write(body);
          req.end();
          ENDSCRIPT
