name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Inject secrets into wrangler.toml
        run: |
          python3 << 'PYEOF'
          import os
          with open('wrangler.toml', 'r') as f:
              lines = f.readlines()
          all_vars = ['IPINFO_TOKEN', 'ABUSEIPDB_TOKEN', 'AD_TOP_HTML', 'AD_160_HTML']
          result = []
          for line in lines:
              for var in all_vars:
                  val = os.environ.get(var, '')
                  if line.strip().startswith(var + ' =') and not val:
                      line = None
                      break
                  esc = val.replace("'''", "''" + "'")
                  line = line.replace('"${' + var + '}"', "'''" + esc + "'''")
              if line is not None:
                  result.append(line)
          with open('wrangler.toml', 'w') as f:
              f.writelines(result)
          PYEOF
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}

      - name: Set Pages secrets (via API)
        run: |
          for secret in AD_TOP_HTML AD_160_HTML IPINFO_TOKEN ABUSEIPDB_TOKEN; do
            val=$(printenv "$secret")
            if [ -n "$val" ]; then
              echo "Setting $secret..."
              curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/linkozen/secrets" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$secret\", \"text\": $(echo "$val" | jq -Rs .)}" | jq '.success'
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
