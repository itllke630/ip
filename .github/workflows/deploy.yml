# .github/workflows/deploy.yml
# ───────────────────────────────────────────────────────────────────
# Deploys both the Cloudflare Worker (backend) and the static landing
# page (frontend) on every push to main.
#
# REQUIRED SECRETS (set in GitHub repo → Settings → Secrets & Variables → Actions):
#   CLOUDFLARE_API_TOKEN    – API token with Workers & Pages edit permissions
#   CLOUDFLARE_ACCOUNT_ID   – Your Cloudflare account ID (32-char hex)
#
# OPTIONAL SECRETS (ad codes — if absent, placeholder zones are shown):
#   AD_TOP_HTML             – 728×90 leaderboard ad HTML/JS code
#   AD_160_HTML             – 160×600 skyscraper ad HTML/JS code (applied to both sides)
#
# PAGES PROJECT (one-time setup):
#   1. Create a Pages project named "ip-linkozen" in the Cloudflare Dashboard
#      (Workers & Pages → Pages → Create a project → Upload assets)
#   2. After the first deploy, the action will update it automatically.

name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # allow manual runs from the Actions tab

# ── Concurrency: only one deploy at a time per branch ────────────
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Worker (backend) ─────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:    deploy

  # ── Pages (frontend) ─────────────────────────────────────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: []  # runs in parallel with deploy-worker
    steps:
      - uses: actions/checkout@v4

      # Inject ad codes from GitHub Secrets into the placeholder slots.
      # Unset secrets keep their '__AD_xxx__' placeholder → JS shows fallback.
      - name: Inject ad slots
        run: |
          AD_TOP='${{ secrets.AD_TOP_HTML }}'
          AD_160='${{ secrets.AD_160_HTML }}'

          if [ -n "$AD_TOP" ]; then sed -i "s|__AD_TOP_HTML__|${AD_TOP//&/\\&}|g" index.html; fi
          if [ -n "$AD_160" ]; then sed -i "s|__AD_160_HTML__|${AD_160//&/\\&}|g" index.html; fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ip-linkozen
          directory:   .
          branch:      main
