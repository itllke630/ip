name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════
  #  Worker — 独立部署，与 Pages 并行
  # ═══════════════════════════════════════════════════════════════
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy Worker
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

      - name: Inject Google AdSense
        run: sed -i "s/GOOGLE_ADSENSE_ID/${{ secrets.GOOGLE_ADSENSE }}/g" public/*.html

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.AD_TOP_HTML }}" | npx wrangler secret put AD_TOP_HTML --name=linkozen-worker
          echo "${{ secrets.AD_160_HTML }}" | npx wrangler secret put AD_160_HTML --name=linkozen-worker
          echo "${{ secrets.IPINFO_TOKEN }}" | npx wrangler secret put IPINFO_TOKEN --name=linkozen-worker
          echo "${{ secrets.ABUSEIPDB_TOKEN }}" | npx wrangler secret put ABUSEIPDB_TOKEN --name=linkozen-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ═══════════════════════════════════════════════════════════════
  #  Pages — 独立部署，与 Worker 并行
  # ═══════════════════════════════════════════════════════════════
  deploy-pages:
    runs-on: ubuntu-latest
    name: Deploy Pages
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

      - name: Inject Google AdSense
        run: sed -i "s/GOOGLE_ADSENSE_ID/${{ secrets.GOOGLE_ADSENSE }}/g" public/*.html

      - name: Deploy Pages
        run: npx wrangler pages deploy public/ --project-name=linkozen --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Pages secrets
        run: |
          echo "${{ secrets.AD_TOP_HTML }}" | npx wrangler pages secret put AD_TOP_HTML --project-name=linkozen
          echo "${{ secrets.AD_160_HTML }}" | npx wrangler pages secret put AD_160_HTML --project-name=linkozen
          echo "${{ secrets.IPINFO_TOKEN }}" | npx wrangler pages secret put IPINFO_TOKEN --project-name=linkozen
          echo "${{ secrets.ABUSEIPDB_TOKEN }}" | npx wrangler pages secret put ABUSEIPDB_TOKEN --project-name=linkozen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
