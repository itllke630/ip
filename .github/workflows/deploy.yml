name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: List all Pages projects & accounts
        run: |
          echo "=== Account ID: $CLOUDFLARE_ACCOUNT_ID ==="
          echo "=== Token preview: ${CLOUDFLARE_API_TOKEN:0:10}... ==="
          echo "=== Pages projects ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '{result_count: (.result | length), projects: [.result[]? | {name, subdomain}]}'
          echo "=== Verify token ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '{status: .result.status, id: .result.id}'
          echo "=== End ==="
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (via API)
        run: |
          # Zip the public/ directory and upload via API
          cd public && zip -r ../site.zip . && cd ..
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/linkozen/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "file=@site.zip" \
            -F "branch=main" | jq '{success: .success, errors: .errors, id: .result.id, url: .result.url}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.AD_TOP_HTML }}" | npx wrangler secret put AD_TOP_HTML --name=linkozen-worker
          echo "${{ secrets.AD_160_HTML }}" | npx wrangler secret put AD_160_HTML --name=linkozen-worker
          echo "${{ secrets.IPINFO_TOKEN }}" | npx wrangler secret put IPINFO_TOKEN --name=linkozen-worker
          echo "${{ secrets.ABUSEIPDB_TOKEN }}" | npx wrangler secret put ABUSEIPDB_TOKEN --name=linkozen-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Pages secrets (via API)
        run: |
          for secret in AD_TOP_HTML AD_160_HTML IPINFO_TOKEN ABUSEIPDB_TOKEN; do
            val=$(printenv "$secret")
            if [ -n "$val" ]; then
              echo "Setting $secret..."
              curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/linkozen/secrets" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$secret\", \"text\": $(echo "$val" | jq -Rs .)}" | jq '.success'
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AD_TOP_HTML: ${{ secrets.AD_TOP_HTML }}
          AD_160_HTML: ${{ secrets.AD_160_HTML }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
