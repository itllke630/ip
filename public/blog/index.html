      'blog.read_more':'Devamını Oku','blog.back_to_blog':'← Bloga Dön','blog.loading':'Yazılar yükleniyor...','blog.no_posts':'Henüz yazı yok. Yakında tekrar kontrol edin!','blog.min_read':'{n} dk okuma',
      'blog.footer':'© 2026 Linkozen DevLog · Cloudflare Tarafından Desteklenmektedir',
    },
    'zh-TW': {
      'page.title':'Linkozen DevLog',
      'nav.home':'首頁','nav.tools':'工具','nav.2fa':'2FA 工具','nav.forex':'匯率換算','nav.ip':'IP 查詢','nav.pass':'密碼產生器','nav.text':'文字清洗器','nav.webp':'圖片轉換器','nav.ico':'ICO 圖示產生器','nav.ai':'AI 頭像產生器','nav.dedupli':'圖片去重工具',
      'blog.title':'Linkozen DevLog','blog.subtitle':'記錄獨立開發幕後：新功能的設計想法、技術選型與迭代日誌。','blog.breadcrumb_home':'首頁','blog.breadcrumb_blog':'部落格',
      'blog.filter_all':'全部','blog.filter_design':'設計想法','blog.filter_tech':'技術實作','blog.filter_update':'功能更新',
      'blog.read_more':'閱讀全文','blog.back_to_blog':'← 返回部落格','blog.loading':'載入文章中...','blog.no_posts':'暫無文章，敬請期待！','blog.min_read':'{n} 分鐘閱讀',
      'blog.footer':'© 2026 Linkozen DevLog · Powered by Cloudflare',
    },
  };

  var currentLang = localStorage.getItem('blog-lang') || 'zh';
  function t(key) {
    var d = DICT[currentLang] || DICT['zh'];
    return d[key] != null ? d[key] : ((DICT['zh'][key] != null) ? DICT['zh'][key] : ((DICT['en'][key] != null) ? DICT['en'][key] : key));
  }

  function updateLanguageUI() {
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute('data-i18n');
      if (k) els[i].innerHTML = t(k);
    }
    document.title = t('page.title');
    var htmlEl = document.documentElement;
    htmlEl.lang = (currentLang === 'zh') ? 'zh-CN' : (currentLang === 'zh-TW') ? 'zh-TW' : currentLang;
    renderAll();
  }

  function updateLangButton() {
    var btn = document.getElementById('btn-lang-label');
    var lang = LANGS.find(function(l) { return l.code === currentLang; });
    if (btn && lang) btn.textContent = lang.native;
  }

  function buildLangMenu() {
    var menu = document.getElementById('lang-menu');
    if (!menu) return;
    var html = '';
    for (var i = 0; i < LANGS.length; i++) {
      var L = LANGS[i];
      var active = L.code === currentLang ? ' bg-cyan-900/30' : '';
      html += '<button class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-700 transition-colors flex items-center gap-3' + active + '" onclick="switchLanguage(\'' + L.code + '\');closeLangMenu()">' +
        '<span class="text-[11px] font-bold text-slate-500 w-7">' + L.region + '</span>' +
        '<span class="text-slate-300">' + L.native + '</span>' +
        '</button>';
    }
    menu.innerHTML = html;
  }

  window.switchLanguage = function(lang) {
    currentLang = lang;
    localStorage.setItem('blog-lang', lang);
    updateLangButton();
    buildLangMenu();
    updateLanguageUI();
  };

  window.toggleLangMenu = function() {
    var menu = document.getElementById('lang-menu');
    if (!menu) return;
    buildLangMenu();
    menu.classList.toggle('hidden');
  };
  window.closeLangMenu = function() {
    var menu = document.getElementById('lang-menu');
    if (menu) menu.classList.add('hidden');
  };

  window.toggleToolsMenu = function () {
    var menu = document.getElementById('tools-menu');
    if (menu) menu.classList.toggle('hidden');
  };
  window.closeToolsMenu = function () {
    var menu = document.getElementById('tools-menu');
    if (menu) menu.classList.add('hidden');
  };

  document.addEventListener('click', function(e) {
    var dd = document.getElementById('lang-dropdown');
    if (dd && !dd.contains(e.target)) {
      var menu = document.getElementById('lang-menu');
      if (menu) menu.classList.add('hidden');
    }
    var td = document.getElementById('tools-dropdown');
    if (td && !td.contains(e.target)) {
      var tmenu = document.getElementById('tools-menu');
      if (tmenu) tmenu.classList.add('hidden');
    }
  });

  // ==========================================================================
  //  BLOG LOGIC
  // ==========================================================================
  var posts = [];
  var activeCategory = 'all';

  var CATEGORIES = [
    { key: 'all', i18n: 'blog.filter_all' },
    { key: 'design-idea', i18n: 'blog.filter_design' },
    { key: 'tech-implementation', i18n: 'blog.filter_tech' },
    { key: 'feature-update', i18n: 'blog.filter_update' },
  ];

  function fetchPosts() {
    return fetch('posts/posts.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        posts = data;
        // Sort by date descending
        posts.sort(function(a, b) { return b.date.localeCompare(a.date); });
      })
      .catch(function() {
        posts = [];
      });
  }

  function getLocalized(field) {
    if (!field) return '';
    if (typeof field === 'string') return field;
    return field[currentLang] || field['zh'] || field['en'] || Object.values(field)[0] || '';
  }

  function renderTabs() {
    var container = document.getElementById('category-tabs');
    var html = '';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var isActive = cat.key === activeCategory;
      html += '<button onclick="setCategory(\'' + cat.key + '\')" class="px-4 py-1.5 text-xs font-medium rounded-full transition-colors ' +
        (isActive ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200') + '">' +
        t(cat.i18n) + '</button>';
    }
    container.innerHTML = html;
  }

  function renderPosts() {
    var container = document.getElementById('post-list');
    var filtered = activeCategory === 'all' ? posts : posts.filter(function(p) { return p.category === activeCategory; });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500"><p class="text-lg" data-i18n="blog.no_posts">' + t('blog.no_posts') + '</p></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      var p = filtered[i];
      var title = getLocalized(p.title);
      var summary = getLocalized(p.summary);
      var catLabel = '';
      for (var j = 0; j < CATEGORIES.length; j++) {
        if (CATEGORIES[j].key === p.category) { catLabel = t(CATEGORIES[j].i18n); break; }
      }
      var readTime = (t('blog.min_read')).replace('{n}', p.readTime);

      html += '<article class="bg-slate-900 border border-slate-800 rounded-xl p-5 sm:p-6 hover:border-slate-700 transition-colors animate-slide-up">' +
        '<div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500 mb-3">' +
          '<time datetime="' + p.date + '" class="text-slate-400">' + p.date + '</time>' +
          '<span>·</span><span>' + readTime + '</span><span>·</span>' +
          '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-900/40 text-cyan-300 border border-cyan-800">' + catLabel + '</span>' +
        '</div>' +
        '<h3 class="text-lg sm:text-xl font-semibold text-slate-100 mb-2">' +
          '<a href="post.html?slug=' + p.slug + '" class="hover:text-cyan-400 transition-colors">' + title + '</a>' +
        '</h3>' +
        '<p class="text-sm text-slate-400 leading-relaxed mb-3">' + summary + '</p>' +
        '<a href="post.html?slug=' + p.slug + '" class="inline-flex items-center gap-1 text-sm font-medium text-cyan-400 hover:text-cyan-300 transition-colors group">' +
          '<span data-i18n="blog.read_more">' + t('blog.read_more') + '</span>' +
          '<svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>' +
        '</a>' +
      '</article>';
    }
    container.innerHTML = html;
  }

  function renderAll() {
    renderTabs();
    renderPosts();
  }

  window.setCategory = function(cat) {
    activeCategory = cat;
    renderAll();
  };

  // ==========================================================================
  //  INIT
  // ==========================================================================
  updateLangButton();
  buildLangMenu();
  updateLanguageUI();

  fetchPosts().then(function() {
    updateLanguageUI();
  });

})();
</script>
</body>
</html>
