name = "linkozen"
main = "worker/index.js"

# 部署时需要配置以下路由 (Cloudflare Dashboard → Workers → Routes):
#   www.linkozen.com/*   → linkozen
#   v4.linkozen.com/*    → linkozen  (DNS: 仅 A 记录)
#   v6.linkozen.com/*    → linkozen  (DNS: 仅 AAAA 记录)

# 打包配置
minify = true
compatibility_date = "2025-06-02"

# 静态资源配置 (Worker)
[assets]
binding = "ASSETS"
directory = "public"

