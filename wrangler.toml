# wrangler.toml — Cloudflare Worker configuration
# Deployed via .github/workflows/deploy.yml

name = "ip-linkozen-worker"
main = "backend-worker.js"
compatibility_date = "2026-06-01"

# ── Observability ─────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

